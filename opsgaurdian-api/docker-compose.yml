services:
  postgres:
    image: postgres:16-alpine
    container_name: opsgaurdian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsgaurdian
      POSTGRES_PASSWORD: opsgaurdian_dev
      POSTGRES_DB: opsgaurdian
    ports:
      - "5433:5432"  # 5433 host → avoid clash with system postgres
    volumes:
      - opsgaurdian_pg_data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsgaurdian"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  opsgaurdian_pg_data:
